<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>مزرعه جینگو</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#6db648;font-family:Tahoma,system-ui,sans-serif;touch-action:none;color:#4a2a0c}
#vp{position:fixed;inset:0;overflow:hidden;background:#6db648}
#world{position:absolute;left:0;top:0;width:1460px;height:1000px;transform-origin:0 0;direction:ltr;will-change:transform;--inv:1}
.ground{position:absolute;left:-700px;top:-700px;width:2860px;height:2400px;pointer-events:none;background:#6db648}
.bd{position:absolute;background-repeat:no-repeat;background-size:520px 2241px;display:none}
.bd.on{display:block}.bd.l3,.bd.l5{}
.bd.pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.1) translateY(-300px);opacity:0}100%{transform:none;opacity:1}}
.bd:active{filter:brightness(1.12)}
.lbl,.bdg{position:absolute;left:50%;transform:translateX(-50%) scale(var(--inv));white-space:nowrap;direction:rtl;pointer-events:none}
.lbl{top:-8px;transform-origin:50% 0;background:linear-gradient(#b97a3a,#8b5a2b);color:#ffe9b0;border:2px solid #5e3a17;border-radius:10px;padding:3px 12px;font:700 14px Tahoma;box-shadow:0 3px 0 #5e3a17}.lbl b{color:#ffd84a}
.bdg{top:-44px;transform-origin:50% 100%;background:#fff;border:2px solid #4a2a0c;border-radius:14px;padding:2px 10px;font:700 14px Tahoma;}
.cell{position:absolute;background:rgba(255,226,140,.13)}.cell.rp{background:rgba(255,215,60,.28);animation:pl 1.2s infinite}.cell.lk{background:rgba(0,0,0,.32)}@keyframes pl{50%{background:rgba(255,215,60,.12)}}
.cell .e{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:34px;line-height:1;pointer-events:none;text-shadow:0 4px 3px #0005;white-space:nowrap}
.cell.rp .e{animation:sw 1.4s ease-in-out infinite}@keyframes sw{50%{transform:translate(-50%,-55%) rotate(5deg)}}
.cell .t{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--inv));font:700 12px Tahoma;color:#fff;background:#0007;border-radius:8px;padding:1px 6px;pointer-events:none}
.pf{position:absolute;pointer-events:none;font-size:30px;animation:fl 1.1s ease-out forwards;transform:scale(var(--inv))}@keyframes fl{to{transform:translateY(-80px) scale(var(--inv));opacity:0}}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:6px;right:6px;display:flex;gap:5px;justify-content:center;z-index:5;pointer-events:none}
.pill{background:linear-gradient(#b97a3a,#8b5a2b);border:2px solid #5e3a17;color:#ffe9b0;border-radius:14px;padding:4px 8px;font:700 13px Tahoma;box-shadow:0 3px 0 #5e3a17;white-space:nowrap}
#nav{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:6px;right:6px;display:flex;gap:6px;z-index:5}
#nav button,.btn{flex:1;font:700 14px Tahoma;color:#ffe9b0;background:linear-gradient(#c68a45,#8b5a2b);border:2px solid #5e3a17;border-radius:12px;padding:9px 4px;box-shadow:0 4px 0 #5e3a17}
#nav button:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5e3a17}.btn.g{background:linear-gradient(#78c850,#3f8f2a);border-color:#245a14;box-shadow:0 4px 0 #245a14;color:#fff}.btn.y{background:linear-gradient(#ffd84a,#e8a000);border-color:#8a5a00;box-shadow:0 4px 0 #8a5a00;color:#4a2a0c}.btn[disabled]{filter:grayscale(1);opacity:.55}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#ffe9b0;border-top:4px solid #8b5a2b;border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s;max-height:66vh;overflow:auto;box-shadow:0 -8px 24px #0006;touch-action:pan-y}
#sh.o{transform:none}#sh h3{margin:0 0 6px;font-size:18px}#sh p{margin:4px 0 8px;font-size:14px;line-height:1.7}.row{display:flex;gap:8px;margin-top:8px}
.bar{height:14px;border-radius:8px;background:#0003;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(#ffd84a,#f0a000);width:0}
.card{background:#fff6;border:2px solid #b97a3a;border-radius:14px;padding:8px 10px;margin:8px 0}.card .h{display:flex;justify-content:space-between;align-items:center;font-weight:700}.card small{display:block;color:#6a4a22;line-height:1.6;font-size:12px}.st{color:#e8a000;letter-spacing:1px}
.tabs{display:flex;gap:8px;margin:6px 0 4px}.tabs .btn{flex:1}.tabs .btn.on{background:linear-gradient(#78c850,#3f8f2a);color:#fff;border-color:#245a14}
#dl{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.dt{position:absolute;width:64px;height:32px;background-size:64px 32px;background-repeat:no-repeat}
.dt.new{animation:dtp .35s ease-out}@keyframes dtp{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
#gh{position:absolute;width:64px;height:32px;background:#ffffff66;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);pointer-events:none;display:none}
#db{position:fixed;left:6px;right:6px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 52px);z-index:6;background:#ffe9b0;border:3px solid #8b5a2b;border-radius:16px;padding:8px 10px;box-shadow:0 4px 0 #5e3a17,0 8px 20px #0005;display:none}
#db.o{display:block}#db .t{font:700 13px/1.6 Tahoma;margin-bottom:6px;text-align:center}#db .row{margin-top:0}#db .btn.on{background:linear-gradient(#78c850,#3f8f2a);color:#fff;border-color:#245a14;box-shadow:0 4px 0 #245a14}
#x{position:absolute;top:8px;left:12px;font:700 22px Tahoma;color:#8b5a2b;padding:4px 8px}
#toast{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:9;background:#2b1a08e6;color:#fff;border-radius:14px;padding:8px 16px;font:700 14px Tahoma;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}#toast.o{opacity:1}
</style></head><body>
<div id="vp"><div id="world"><div class="ground"></div></div></div>
<div id="top"><span class="pill" id="pC">🪙 0</span><span class="pill" id="pU">📦 0/0</span><span class="pill" id="pW">🌾 0</span><span class="pill" id="pF">🥣 0</span><span class="pill" id="pB">🍞 0</span></div>
<div id="nav"><button data-g="field">🌾 زمین</button><button data-g="mill">🌀 آسیاب</button><button data-g="bakery">🍞 نونوایی</button><button data-g="market">🏪 بازار</button><button data-g="deco">🧱 تزئین</button></div>
<div id="db"><div class="t" id="dt"></div><div class="row"><button class="btn" id="dpu">🧱 گذاشتن</button><button class="btn" id="der">🧽 برداشتن</button><button class="btn" id="dmv">🔀 جابجایی</button><button class="btn g" id="dok">✅ تموم</button></div></div>
<div id="sh"><span id="x">✕</span><div id="sb"></div></div><div id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=i=>document.getElementById(i),W=1460,H=1000;
const api=(p,b)=>fetch('/api/farm/w/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','X-Init-Data':tg?tg.initData:''},body:b?JSON.stringify(b):undefined}).then(r=>r.json()).catch(()=>({error:'اینترنت قطع شد'}));
/* اطلس اسپرایت‌ها (x,y,w,h) و جای هر ساختمان روی زمین */
const A={castle:[0,0,496,371],forge:[0,375,337,241],mill:[0,620,295,311],barn:[0,935,360,272],mine:[0,1211,315,262],dairy:[0,1477,316,241],bakery:[0,1722,334,255],field:[0,1981,482,256]};
const POS={field:[120,700],barn:[30,40],castle:[500,10],mine:[1100,40],dairy:[30,380],forge:[420,400],mill:[1130,360],bakery:[700,700]};
const ORDER=['mill','bakery','dairy','forge','field'];
const FIXED=['castle','barn','mine'];/* از اول هستن؛ نه خرید دارن نه ارتقا */
const R={};for(const k in A)R[k]=[POS[k][0],POS[k][1],A[k][2],A[k][3]];
const Q={T:[256,38],R:[440,123],B:[231,208],L:[58,126]},N=3,FX=POS.field;
let S=null,off=0,sc=.8,tx=0,ty=0,drag=false,hits=0,cur=null,key='',mtab='buy';
const wd=$('world');
const dl=document.createElement('div');dl.id='dl';wd.append(dl);const gh=document.createElement('div');gh.id='gh';wd.append(gh);
let deco=false,dmode='put',dsig='',mv=null;const GX=730,TW=32,TH=16;/* شبکه‌ی ایزومتریک کاشی‌ها: هر کاشی ۶۴×۳۲ */
(function(){const C=[['#d6a867','#b98443'],['#e0b974','#c99552'],['#b7803f','#9c6a30']];const st=document.createElement('style');st.textContent=C.map((c,v)=>{const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='64' height='32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c[0]}'/><stop offset='1' stop-color='${c[1]}'/></linearGradient></defs><polygon points='32,0 64,16 32,32 0,16' fill='#6b4423'/><polygon points='32,2 60,16 32,30 4,16' fill='url(#g)'/><path d='M14 16L30 8M24 20L44 10M34 24L52 15M20 12L28 8' stroke='#f3dc9c' stroke-opacity='.55'/><circle cx='26' cy='14' r='1.4' fill='#8a5c2e'/><circle cx='40' cy='19' r='1.4' fill='#8a5c2e'/></svg>`;return `.dt.v${v}{background-image:url("data:image/svg+xml,${encodeURIComponent(svg)}")}`}).join('');document.head.append(st)})();
const dpos=(i,j)=>[GX+(i-j)*TW,(i+j)*TH];
var lsc=0,raf=0;const camR=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;cam()})};function cam(){const vw=innerWidth,vh=innerHeight;sc=Math.min(1.7,Math.max(.3,sc));tx=Math.min(160,Math.max(vw-W*sc-160,tx));ty=Math.min(160,Math.max(vh-H*sc-200,ty));wd.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${sc})`;if(sc!==lsc){lsc=sc;wd.style.setProperty('--inv',1/sc)}}
function focus(k,z){const r=R[k];sc=z||.9;tx=innerWidth/2-(r[0]+r[2]/2)*sc;ty=(innerHeight-260)/2-(r[1]+r[3]/2)*sc;wd.style.transition='transform .5s';cam();setTimeout(()=>wd.style.transition='',520)}
/* ---- ساخت صحنه ---- */
const bEl={};
for(const k in A){const r=R[k],d=document.createElement('div');d.className='bd'+(k=='field'?' on':'');d.dataset.k=k;Object.assign(d.style,{left:r[0]+'px',top:r[1]+'px',width:r[2]+'px',height:r[3]+'px',backgroundImage:'url(/farmworld/atlas.webp)',backgroundPosition:`0 -${A[k][1]}px`});
 if(k=='field')d.style.pointerEvents='none';
 d.innerHTML='<span class="lbl"></span><span class="bdg" style="display:none"></span>';d.onclick=()=>{if(!drag)openSh(k)};wd.append(d);bEl[k]=d}
const cells=[];
(function(){const P=(i,j)=>[FX[0]+Q.T[0]+(Q.R[0]-Q.T[0])*i/N+(Q.L[0]-Q.T[0])*j/N,FX[1]+Q.T[1]+(Q.R[1]-Q.T[1])*i/N+(Q.L[1]-Q.T[1])*j/N];
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const c=[P(i,j),P(i+1,j),P(i+1,j+1),P(i,j+1)],xs=c.map(p=>p[0]),ys=c.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0,h=Math.max(...ys)-y0,idx=j*N+i;
const d=document.createElement('div');d.className='cell';Object.assign(d.style,{left:x0+'px',top:y0+'px',width:w+'px',height:h+'px',clipPath:'polygon('+c.map(p=>(p[0]-x0)+'px '+(p[1]-y0)+'px').join(',')+')'});
d.innerHTML='<span class="e"></span><span class="t"></span>';d.onclick=()=>{if(!drag)cellTap(idx)};wd.append(d);cells.push(d)}})();
/* ---- کمک‌ها ---- */
const nowS=()=>Date.now()/1000+off,fmt=s=>{s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+'s'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('o');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('o'),2300)}
function puff(k,e){const r=R[k],d=document.createElement('span');d.className='pf';d.textContent=e;d.style.left=r[0]+r[2]*(.25+Math.random()*.5)+'px';d.style.top=r[1]+r[3]*.45+'px';wd.append(d);setTimeout(()=>d.remove(),1100)}
async function act(p,b){const old=S?{...S.b}:{};const r=await api(p,b||{});if(r.error){toast(r.error);return null}S=r.state;off=S.now-Date.now()/1000;if(r.msg)toast(r.msg);
 for(const k in S.b)if(S.b[k]&&!old[k]&&k!='field'){const e=bEl[k];e.classList.add('on','pop');setTimeout(()=>e.classList.remove('pop'),950);render(true);setTimeout(()=>{focus(k,.85);puff(k,'🎉')},250);return r}
 render(true);return r}
const mst=()=>S.mill.n?(nowS()>=S.mill.at?'done':'run'):'idle',ost=()=>S.oven.n?(nowS()>=S.oven.at?'done':'run'):'idle';
const rdy=()=>S.plots.filter((t,i)=>t&&i<S.open&&nowS()-t>=S.grow).length;
function cellTap(i){if(!S||deco)return;if(i>=S.open){toast('این خانه با ارتقای زمین باز میشه 🔒');return}const t=S.plots[i];if(!t)act('plant',{i}).then(r=>r&&puff('field','🌱'));else if(nowS()-t>=S.grow)act('harvest',{i}).then(r=>r&&puff('field','🌾'));else toast('هنوز نرسیده: '+fmt(S.grow-(nowS()-t))+' مونده ⏳')}
/* ---- نمایش ---- */
const setH=(el,h)=>{if(el._h!==h){el._h=h;el.innerHTML=h}};
function render(full){if(!S)return;$('pC').textContent='🪙 '+S.coins;$('pU').textContent='📦 '+S.used+'/'+S.cap;$('pW').textContent='🌾 '+S.inv.wheat;$('pF').textContent='🥣 '+S.inv.flour;$('pB').textContent='🍞 '+S.inv.bread;
 cells.forEach((d,i)=>{const t=S.plots[i],e=d.firstChild,tt=d.lastChild;d.classList.toggle('lk',i>=S.open);if(i>=S.open){e.textContent='🔒';tt.style.display='none';d.classList.remove('rp');return}
  if(!t){e.textContent='';tt.style.display='none';d.classList.remove('rp')}else{const el=nowS()-t;if(el>=S.grow){e.textContent='🌾🌾🌾';tt.style.display='none';d.classList.add('rp')}else{e.textContent=el>S.grow/2?'🌿🌿🌿':'🌱🌱';tt.style.display='';tt.textContent=fmt(S.grow-el);d.classList.remove('rp')}}});
 for(const k in A){if(k=='field')continue;const e=bEl[k],lv=S.b[k]||0;e.classList.toggle('on',lv>0);const fx=FIXED.includes(k);e.classList.toggle('l3',!fx&&lv>=3&&lv<5);e.classList.toggle('l5',!fx&&lv>=5);setH(e.querySelector('.lbl'),fx?S.name[k]:S.name[k]+' <b>Lv'+lv+'</b>')}
 drawDeco();applyPos();
 const lf=bEl.field.querySelector('.lbl');setH(lf,S.name.field+' <b>Lv'+S.b.field+'</b>');
 const bd=(k,t)=>{const b=bEl[k].querySelector('.bdg');const dd=t?'':'none';if(b.style.display!==dd)b.style.display=dd;if(b._t!==(t||'')){b._t=t||'';b.textContent=t||''}},ms=S.b.mill?mst():'',os=S.b.bakery?ost():'',rr=rdy();
 bd('field',rr?'🌾 '+rr+' آماده':'');bd('mill',ms=='done'?'✅ آرد آماده! بزن':ms=='run'?'⏳ '+fmt(S.mill.at-nowS()):'');bd('bakery',os=='done'?'✅ نون آماده!':os=='run'?'⏳ '+fmt(S.oven.at-nowS()):'');
 bd('dairy',S.acc.dairy?'🥛 '+S.acc.dairy:'');bd('mine',S.acc.mine?'🪨 '+S.acc.mine:'');
 bEl.field.querySelector('.lbl').style.pointerEvents='none';sheet(full)}
function sheet(full){if(!cur)return;const kk=JSON.stringify([cur,mtab,S.coins,S.b,S.inv,S.acc,S.mill.n?mst():0,S.oven.n?ost():0,S.mill.n,S.oven.n,rdy()]);if(full||kk!==key){key=kk;draw()}else upd()}
function upd(){const b=$('bar'),tm=$('tm');if(!b)return;const m=cur=='mill'?S.mill:S.oven,tot=m.n*(cur=='mill'?S.mill_secs:S.bake_secs);b.style.width=Math.min(100,100-(m.at-nowS())/tot*100)+'%';tm.textContent=fmt(m.at-nowS())}
const stars=l=>'★'.repeat(l)+'☆'.repeat(5-l);
function upBtn(k,cls){const lv=S.b[k]||0;if(lv>=S.maxl)return'<p>⭐ به بالاترین لول رسیده</p>';const c=S.next_cost[k];return `<p style="margin:6px 0 2px;font-size:13px">${lv?'لول '+lv+': '+S.info[k][lv-1]+'<br>':''}<b>لول بعد (${lv+1}):</b> ${S.info[k][lv]}</p><div class="row"><button class="btn y up" data-k="${k}" ${S.coins<c?'disabled':''}>${lv?'⬆ ارتقا به لول '+(lv+1):'🛒 خرید'} • ${c} 🪙</button></div>`}
function draw(){const k=cur,s=$('sb'),R_=(...a)=>`<div class="row">${a.join('')}</div>`,bt=(t,id,c,dis)=>`<button class="btn ${c||''}" id="${id}" ${dis?'disabled':''}>${t}</button>`;let h='';
 if(k=='market'){h=`<h3>🏪 بازار جینگو</h3><div class="tabs"><button class="btn ${mtab=='buy'?'on':''}" data-t="buy">🛒 خرید و ارتقا</button><button class="btn ${mtab=='sell'?'on':''}" data-t="sell">💰 فروش</button></div>`;
  if(mtab=='buy')h+=ORDER.map(q=>{const lv=S.b[q]||0,c=S.next_cost[q],mx=lv>=S.maxl;return `<div class="card"><div class="h"><span>${S.name[q]}</span><span class="st">${stars(lv)}</span></div><small>${S.desc[q]}<br>${lv?'الان: '+S.info[q][lv-1]:'🔒 نخریدی'}${mx?'':'<br>بعدی: '+S.info[q][lv]}</small>${mx?'<small>⭐ حداکثر لول</small>':`<div class="row"><button class="btn y up" data-k="${q}" ${S.coins<c?'disabled':''}>${lv?'⬆ ارتقا':'🛒 خرید'} • ${c} 🪙</button></div>`}</div>`}).join('');
  else{const it=[['wheat','🌾 گندم'],['flour','🥣 آرد'],['bread','🍞 نان'],['milk','🥛 شیر'],['ore','🪨 سنگ معدن']];h+=`<p>ظرفیت انبار: ${S.used}/${S.cap} • ضریب فروش ×${S.bonus.toFixed(2)}</p>`+it.map(([a,n])=>{const g=Math.floor(S.inv[a]*S.price[a]*S.bonus);return `<div class="card"><div class="h"><span>${n}: ${S.inv[a]}</span><button class="btn g sl" data-i="${a}" style="flex:none;padding:6px 12px" ${S.inv[a]?'':'disabled'}>فروش همه +${g}🪙</button></div></div>`}).join('')}}
 else if(k=='field'){const e=S.plots.filter((x,i)=>!x&&i<S.open).length;h=`<h3>🌾 زمین گندم <span class="st">${stars(S.b.field)}</span></h3><p>روی هر خانه بزن تا بکاری؛ طلایی که شد بزن تا برداشت بشه. رشد: ${S.grow}s • هر خانه ${S.yield} گندم<br>خالی: ${e} • آماده: ${rdy()}</p>`+R_(bt('🌱 کاشت همه','pa','g'),bt('🌾 برداشت همه','ha'))+upBtn('field')}
 else if(!(S.b[k]>0)){h=`<h3>${S.name[k]}</h3><p>هنوز نخریدیش. از بازار بخرش 🏪</p>`+R_(bt('🏪 برو بازار','gm','y'))}
 else{h=`<h3>${S.name[k]} <span class="st">${stars(S.b[k])}</span></h3>`;
  if(k=='mill'){const ms=mst();
   if(ms=='idle')h+=`<p>گندم‌ها رو بریز تو آسیاب (تا ${S.mill_max} تا). گندم تو انبار: <b>${S.inv.wheat}</b></p>`+R_(bt('ریختن گندم 🌾⬅️🌀','mp','g',!S.inv.wheat));
   else if(ms=='run')h+=`<p>آسیاب داره ${S.mill.n} گندم رو آرد می‌کنه...</p><div class="bar"><i id="bar"></i></div><p>⏳ <b id="tm"></b></p>`;
   else h+=`<p>آرد آماده‌ست! ${S.mill.n} واحد. ۵ بار آسیاب رو بزن تا آرد بیرون بیاد 👊</p>`+R_(bt('آسیاب بزن 👊 ('+hits+'/5)','mh','g'))}
  else if(k=='bakery'){const os=ost(),mx=Math.min(S.bake_max,Math.floor(S.inv.flour/S.fpb));

   else h+=`<p>${S.oven.n} نان آماده‌ست 🥖</p>`+R_(bt('برداشت نان 🍞','bc','g'))}

const ptr=new Map();let d0,s0,moved=0;const vp=$('vp');
vp.addEventListener('pointerdown',e=>{if(deco&&dmode=='mv'&&S&&!e.target.closest('#db,#nav,#top')){const b=e.target.closest('.bd'),c=e.target.closest('.cell'),k=b?b.dataset.k:c?'field':null;if(k&&(k=='field'||S.b[k]>0)){mv={k,sx:e.clientX,sy:e.clientY,x0:R[k][0],y0:R[k][1],m:0};ptr.set(e.pointerId,[e.clientX,e.clientY]);drag=true;bEl[k].style.filter='brightness(1.2) drop-shadow(0 0 10px #fff)';return}}ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;drag=false;if(ptr.size==2){const[a,b]=[...ptr.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1]);s0=sc}});
addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;if(mv){mv.m=1;setPos(mv.k,mv.x0+(e.clientX-mv.sx)/sc,mv.y0+(e.clientY-mv.sy)/sc);return}const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);if(moved>10)drag=true;
 if(ptr.size==1){tx+=dx;ty+=dy;camR()}else if(ptr.size==2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,n=Math.min(1.7,Math.max(.3,s0*d/d0));tx=cx-(cx-tx)*n/sc;ty=cy-(cy-ty)*n/sc;sc=n;camR()}});

const dok=(i,j)=>{const u=i-j,v=i+j;return u>=-21&&u<=21&&v>=2&&v<=58};
function dblocked(i,j){const[cx,cy]=dpos(i,j);for(const k in A){if(k!='field'&&!(S.b[k]>0))continue;const r=R[k],x0=r[0]+r[2]*.12,x1=r[0]+r[2]*.88,y0=r[1]+r[3]*.25,y1=r[1]+r[3]*.92;if(cx>x0&&cx<x1&&cy>y0&&cy<y1)return true}return false}

 S.deco.slice().sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])).forEach(([i,j])=>{const[cx,cy]=dpos(i,j),e=document.createElement('div'),kk=i+','+j;e.className='dt v'+((i*7+j*3)%3)+(old.size&&!old.has(kk)?' new':'');e.dataset.k=kk;e.style.left=(cx-32)+'px';e.style.top=(cy-16)+'px';dl.append(e)});dtxt()}
function setPos(k,x,y){const r=R[k];x=Math.round(Math.max(0,Math.min(W-r[2],x)));y=Math.round(Math.max(0,Math.min(H-r[3],y)));if(x==r[0]&&y==r[1])return;const dx=x-r[0],dy=y-r[1];r[0]=x;r[1]=y;bEl[k].style.left=x+'px';bEl[k].style.top=y+'px';if(k=='field')cells.forEach(c=>{c.style.left=(parseFloat(c.style.left)+dx)+'px';c.style.top=(parseFloat(c.style.top)+dy)+'px'})}

 if(!dok(i,j)){toast('اینجا بیرون از مزرعه‌ست');return}

 else{if(!has){toast('اینجا کاشی نیست');return}await act('deco_del',{i,j})}});
