<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>مزرعه جینگو</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#5c9e3c;font-family:Tahoma,system-ui,sans-serif;touch-action:none;color:#4a2a0c}
#vp{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#92d45c,#5a9a3a)}
#world{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0;direction:ltr;will-change:transform;--inv:1}
#world>img{position:absolute;left:0;top:0;width:1536px;height:1024px;pointer-events:none;-webkit-user-drag:none}
.hs{position:absolute;border-radius:34px}.hs:active{background:#fff4}
.lbl,.bdg{position:absolute;left:50%;transform:translateX(-50%) scale(var(--inv));white-space:nowrap;direction:rtl;pointer-events:none}
.lbl{top:-4px;transform-origin:50% 0;background:linear-gradient(#b97a3a,#8b5a2b);color:#ffe9b0;border:2px solid #5e3a17;border-radius:10px;padding:3px 12px;font:700 14px Tahoma;box-shadow:0 3px 0 #5e3a17}
.bdg{bottom:92%;transform-origin:50% 100%;background:#fff;border:2px solid #4a2a0c;border-radius:14px;padding:2px 10px;font:700 14px Tahoma;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{margin-bottom:8px}}
.cell{position:absolute;background:rgba(255,226,140,.13)}.cell.rp{background:rgba(255,215,60,.28);animation:pl 1.2s infinite}@keyframes pl{50%{background:rgba(255,215,60,.12)}}
.cell .e{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:34px;line-height:1;pointer-events:none;text-shadow:0 4px 3px #0005;white-space:nowrap}
.cell.rp .e{animation:sw 1.4s ease-in-out infinite}@keyframes sw{50%{transform:translate(-50%,-55%) rotate(5deg)}}
.cell .t{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--inv));font:700 12px Tahoma;color:#fff;background:#0007;border-radius:8px;padding:1px 6px;pointer-events:none}
.clone{position:absolute;display:none;pointer-events:none;background-image:url(/farmworld/map.webp);background-size:1536px 1024px}
.clone.on{display:block;animation:hit .22s}@keyframes hit{30%{transform:scale(1.05,.94)}60%{transform:scale(.97,1.04) rotate(-1deg)}}
.pf{position:absolute;pointer-events:none;font-size:26px;animation:fl 1.1s ease-out forwards;transform:scale(var(--inv))}@keyframes fl{to{transform:translateY(-70px) scale(var(--inv));opacity:0}}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;justify-content:center;z-index:5;pointer-events:none}
.pill{background:linear-gradient(#b97a3a,#8b5a2b);border:2px solid #5e3a17;color:#ffe9b0;border-radius:14px;padding:4px 10px;font:700 14px Tahoma;box-shadow:0 3px 0 #5e3a17}
#nav{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:6px;right:6px;display:flex;gap:6px;z-index:5}
#nav button,.btn{flex:1;font:700 14px Tahoma;color:#ffe9b0;background:linear-gradient(#c68a45,#8b5a2b);border:2px solid #5e3a17;border-radius:12px;padding:9px 2px;box-shadow:0 4px 0 #5e3a17}
#nav button:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5e3a17}.btn.g{background:linear-gradient(#78c850,#3f8f2a);border-color:#245a14;box-shadow:0 4px 0 #245a14;color:#fff}.btn[disabled]{filter:grayscale(1);opacity:.6}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#ffe9b0;border-top:4px solid #8b5a2b;border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s;max-height:62vh;overflow:auto;box-shadow:0 -8px 24px #0006}
#sh.o{transform:none}#sh h3{margin:0 0 6px;font-size:18px}#sh p{margin:4px 0 10px;font-size:14px;line-height:1.7}#sh .row{display:flex;gap:8px;margin-top:8px}
.bar{height:14px;border-radius:8px;background:#0003;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(#ffd84a,#f0a000);width:0}
#x{position:absolute;top:8px;left:12px;font:700 22px Tahoma;color:#8b5a2b}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:9;background:#2b1a08e6;color:#fff;border-radius:14px;padding:8px 16px;font:700 14px Tahoma;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}#toast.o{opacity:1}
</style></head><body>
<div id="vp"><div id="world"><img src="/farmworld/map.webp" alt="">
</div></div>
<div id="top"><span class="pill" id="pC">🪙 0</span><span class="pill" id="pW">🌾 0</span><span class="pill" id="pF">🥣 0</span><span class="pill" id="pB">🍞 0</span></div>
<div id="nav"><button data-g="field">🌾 زمین</button><button data-g="mill">🌀 آسیاب</button><button data-g="bakery">🍞 نونوایی</button><button data-g="barn">📦 انبار</button></div>
<div id="sh"><span id="x">✕</span><div id="sb"></div></div><div id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=i=>document.getElementById(i),W=1536,H=1024;
const api=(p,b)=>fetch('/api/farm/w/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','X-Init-Data':tg?tg.initData:''},body:b?JSON.stringify(b):undefined}).then(r=>r.json()).catch(()=>({error:'اینترنت قطع شد'}));
/* ساختمان‌ها: مختصات دقیقِ خود عکس */
const B={mill:{n:'🌀 آسیاب',r:[110,240,320,570]},bakery:{n:'🍞 نونوایی',r:[960,410,1480,720]},barn:{n:'📦 انبار',r:[450,15,940,340]},castle:{n:'🏰 قلعه',r:[990,0,1536,400]},
 mine:{n:'⛏ معدن',r:[130,60,400,260]},dairy:{n:'🧀 لبنیات',r:[480,360,880,640]},forge:{n:'⚒ آهنگری',r:[800,680,1300,1000]}};
/* زمین خاکی: چهار گوشه (بالا، راست، پایین، چپ) روی عکس */
const Q={T:[405,640],R:[752,803],B:[428,955],L:[75,790]},N=3;
let S=null,off=0,sc=.6,tx=0,ty=0,drag=false,hits=0,cur=null,key='';
const wd=$('world');
function cam(){const vw=innerWidth,vh=innerHeight;sc=Math.min(1.8,Math.max(.28,sc));tx=Math.min(40,Math.max(vw-W*sc-40,tx));ty=Math.min(70,Math.max(vh-H*sc-110,ty));wd.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;wd.style.setProperty('--inv',1/sc)}
function focus(k,z){const r=k=='field'?[60,630,760,960]:B[k].r;sc=z||.95;tx=innerWidth/2-(r[0]+r[2])/2*sc;ty=(innerHeight-170)/2-(r[1]+r[3])/2*sc;wd.style.transition='transform .45s';cam();setTimeout(()=>wd.style.transition='',480)}
/* ---- ساخت صحنه ---- */
const hsEl={};
function mk(k,x0,y0,x1,y1,label,fn){const d=document.createElement('div');d.className='hs';Object.assign(d.style,{left:x0+'px',top:y0+'px',width:x1-x0+'px',height:y1-y0+'px'});d.innerHTML=`<span class="lbl">${label}</span><span class="bdg" style="display:none"></span>`;d.onclick=()=>{if(!drag)fn()};wd.append(d);hsEl[k]=d;return d}
for(const k in B){const r=B[k].r;mk(k,r[0]+20,r[1]+20,r[2]-20,r[3]-10,B[k].n,()=>openSh(k))}
const cells=[];
(function(){const P=(i,j)=>[Q.T[0]+(Q.R[0]-Q.T[0])*i/N+(Q.L[0]-Q.T[0])*j/N,Q.T[1]+(Q.R[1]-Q.T[1])*i/N+(Q.L[1]-Q.T[1])*j/N];
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const c=[P(i,j),P(i+1,j),P(i+1,j+1),P(i,j+1)],xs=c.map(p=>p[0]),ys=c.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0,h=Math.max(...ys)-y0,idx=j*N+i;
const d=document.createElement('div');d.className='cell';Object.assign(d.style,{left:x0+'px',top:y0+'px',width:w+'px',height:h+'px',clipPath:'polygon('+c.map(p=>(p[0]-x0)+'px '+(p[1]-y0)+'px').join(',')+')'});
d.innerHTML='<span class="e"></span><span class="t"></span>';d.onclick=()=>{if(!drag)cellTap(idx)};wd.append(d);cells.push(d)}})();
/* ---- کمک‌ها ---- */
const nowS=()=>Date.now()/1000+off,fmt=s=>{s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+'s'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('o');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('o'),2200)}
function puff(k,e){const r=k=='field'?[60,630,760,960]:B[k].r,d=document.createElement('span');d.className='pf';d.textContent=e;d.style.left=r[0]+(r[2]-r[0])*(.3+Math.random()*.4)+'px';d.style.top=r[1]+(r[3]-r[1])*.5+'px';wd.append(d);setTimeout(()=>d.remove(),1100)}
async function act(p,b){const r=await api(p,b||{});if(r.error){toast(r.error);return null}S=r.state;off=S.now-Date.now()/1000;if(r.msg)toast(r.msg);render(true);return r}
const mst=()=>S.mill.n?(nowS()>=S.mill.at?'done':'run'):'idle',ost=()=>S.oven.n?(nowS()>=S.oven.at?'done':'run'):'idle';
const rdy=()=>S.plots.filter(t=>t&&nowS()-t>=S.grow).length;
/* ---- زمین ---- */
function cellTap(i){if(!S)return;const t=S.plots[i];if(!t){act('plant',{i}).then(r=>r&&puff('field','🌱'))}else if(nowS()-t>=S.grow){act('harvest',{i}).then(r=>r&&puff('field','🌾'))}else toast('هنوز نرسیده: '+fmt(S.grow-(nowS()-t))+' مونده ⏳')}
/* ---- نمایش ---- */
function render(full){if(!S)return;$('pC').textContent='🪙 '+S.coins;$('pW').textContent='🌾 '+S.inv.wheat;$('pF').textContent='🥣 '+S.inv.flour;$('pB').textContent='🍞 '+S.inv.bread;
 cells.forEach((d,i)=>{const t=S.plots[i],e=d.firstChild,tt=d.lastChild;if(!t){e.textContent='';tt.style.display='none';d.classList.remove('rp')}else{const el=nowS()-t;if(el>=S.grow){e.textContent='🌾🌾🌾';tt.style.display='none';d.classList.add('rp')}else{e.textContent=el>S.grow/2?'🌿🌿🌿':'🌱🌱';tt.style.display='';tt.textContent=fmt(S.grow-el);d.classList.remove('rp')}}});
 const bd=(k,t)=>{const b=hsEl[k].querySelector('.bdg');b.style.display=t?'':'none';b.textContent=t||''};
 const ms=mst(),os=ost(),rr=rdy();
 bd('mill',ms=='done'?'✅ آرد آماده! بزن':ms=='run'?'⏳ '+fmt(S.mill.at-nowS()):'');bd('bakery',os=='done'?'✅ نون آماده!':os=='run'?'⏳ '+fmt(S.oven.at-nowS()):'');bd('barn','');
 sheet(full)}
function sheet(full){if(!cur)return;const k=cur,kk=k+(k=='mill'?mst()+S.inv.wheat:k=='bakery'?ost()+S.inv.flour:k=='field'?rdy()+'/'+S.plots.filter(x=>!x).length:k=='barn'?S.inv.wheat+'/'+S.inv.flour+'/'+S.inv.bread:'');if(full||kk!==key){key=kk;draw()}else upd()}
function upd(){const b=$('bar'),tm=$('tm');if(!b)return;const m=cur=='mill'?S.mill:S.oven,tot=cur=='mill'?S.mill.n*S.mill_secs:S.oven.n*S.bake_secs;b.style.width=Math.min(100,100-(m.at-nowS())/tot*100)+'%';tm.textContent=fmt(m.at-nowS())}
function draw(){const k=cur,s=$('sb');let h='';const R=(...a)=>`<div class="row">${a.join('')}</div>`,bt=(t,id,c)=>`<button class="btn ${c||''}" id="${id}">${t}</button>`;
 if(k=='field'){const e=S.plots.filter(x=>!x).length,r=rdy();h=`<h3>🌾 زمین گندم</h3><p>روی هر خانه‌ی خاک بزن تا گندم بکاری؛ وقتی طلایی شد بزن تا برداشت بشه. رشد هر گندم ${S.grow} ثانیه است.<br>خالی: ${e} • آماده‌ی برداشت: ${r}</p>`+R(bt('🌱 کاشت همه','pa','g'),bt('🌾 برداشت همه','ha'))}
 else if(k=='mill'){const ms=mst();h=`<h3>🌀 آسیاب</h3>`;
  if(ms=='idle')h+=`<p>گندم‌ها رو بریز تو آسیاب تا آرد بشن. گندم تو انبار: <b>${S.inv.wheat}</b></p>`+R(bt('ریختن همه‌ی گندم 🌾⬅️🌀','mp','g'));
  else if(ms=='run')h+=`<p>آسیاب داره ${S.mill.n} گندم رو آرد می‌کنه...</p><div class="bar"><i id="bar"></i></div><p>⏳ <b id="tm"></b></p>`;
  else h+=`<p>آرد آماده‌ست! ${S.mill.n} واحد. باید آسیاب رو ۵ بار بزنی تا آرد بیرون بیاد 👊</p>`+R(bt('آسیاب بزن 👊 ('+hits+'/5)','mh','g'))}
 else if(k=='bakery'){const os=ost(),mx=Math.min(S.max_bake,Math.floor(S.inv.flour/S.fpb));h=`<h3>🍞 نونوایی</h3>`;
  if(os=='idle')h+=`<p>هر نان ${S.fpb} آرد می‌خواد. آرد تو انبار: <b>${S.inv.flour}</b></p>`+R(bt(mx?`🔥 بپز: ${mx} نان`:'آرد کافی نداری','bp','g').replace('class','class').replace('<button','<button '+(mx?'':'disabled')));
  else if(os=='run')h+=`<p>${S.oven.n} نان تو تنوره...</p><div class="bar"><i id="bar"></i></div><p>⏳ <b id="tm"></b></p>`;
  else h+=`<p>${S.oven.n} نان آماده‌ست 🥖</p>`+R(bt('برداشت نان 🍞','bc','g'))}
 else if(k=='barn'){const p=S.price,it=[['wheat','🌾 گندم'],['flour','🥣 آرد'],['bread','🍞 نان']];h=`<h3>📦 انبار</h3><p>سکه‌ی مزرعه جداست و به پول ربات ربطی نداره.</p>`+it.map(([a,n])=>`<p style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><span>${n}: <b>${S.inv[a]}</b> (هرتا ${p[a]}🪙)</span><button class="btn g sl" data-i="${a}" style="flex:none;padding:6px 14px" ${S.inv[a]?'':'disabled'}>فروش همه</button></p>`).join('')}
 else if(k=='castle')h=`<h3>🏰 قلعه‌ی جینگو</h3><p>سطح مزرعه: <b>${S.lvl}</b> • تجربه: ${S.xp}<br>هر آرد و نونی که تولید کنی تجربه می‌گیری.</p>`;
 else h=`<h3>${B[k].n}</h3><p>این ساختمان فعلاً تزئینیه و تو آپدیت‌های بعدی فعال میشه 🔨</p>`;
 s.innerHTML=h;const g=i=>$(i);
 if(g('pa'))g('pa').onclick=()=>act('plant',{all:1}).then(r=>r&&puff('field','🌱'));if(g('ha'))g('ha').onclick=()=>act('harvest',{all:1}).then(r=>r&&puff('field','🌾'));
 if(g('mp'))g('mp').onclick=()=>act('mill_put',{});if(g('bp'))g('bp').onclick=()=>act('bake_put',{});if(g('bc'))g('bc').onclick=()=>act('bake_collect',{}).then(r=>r&&puff('bakery','🍞'));
 if(g('mh'))g('mh').onclick=hitMill;s.querySelectorAll('.sl').forEach(b=>b.onclick=()=>act('sell',{item:b.dataset.i,qty:S.inv[b.dataset.i]}).then(r=>r&&puff('barn','🪙')));upd()}
function hitMill(){const h=hsEl.mill;h.style.background='#fff7';setTimeout(()=>h.style.background='',130);puff('mill','💨');if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('medium');hits++;if(hits>=5){hits=0;act('mill_collect',{}).then(r=>r&&(puff('mill','🥣'),puff('mill','✨')))}else $('mh').textContent='آسیاب بزن 👊 ('+hits+'/5)'}
function openSh(k){cur=k;hits=0;key='';focus(k,k=='field'?.8:.9);$('sh').classList.add('o');if(S)sheet(true)}
$('x').onclick=()=>{cur=null;$('sh').classList.remove('o')};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>openSh(b.dataset.g));
/* زمین: ضربه روی خودِ خاک هم همون کار رو می‌کنه؛ برای باز شدن پنل زمین از دکمه‌ی پایین استفاده میشه */
/* ---- حرکت و زوم دوانگشتی ---- */
const ptr=new Map();let sx,sy,d0,s0,moved=0;
const vp=$('vp');
vp.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;drag=false;if(ptr.size==2){const[a,b]=[...ptr.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1]);s0=sc}});
addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);if(moved>10)drag=true;
 if(ptr.size==1){tx+=dx;ty+=dy;cam()}else if(ptr.size==2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,n=Math.min(1.8,Math.max(.28,s0*d/d0));tx=cx-(cx-tx)*n/sc;ty=cy-(cy-ty)*n/sc;sc=n;cam()}});
const up=e=>{ptr.delete(e.pointerId);setTimeout(()=>{if(!ptr.size)drag=false},60)};addEventListener('pointerup',up);addEventListener('pointercancel',up);
vp.addEventListener('wheel',e=>{e.preventDefault();const n=sc*(e.deltaY<0?1.1:.9);tx=e.clientX-(e.clientX-tx)*n/sc;ty=e.clientY-(e.clientY-ty)*n/sc;sc=n;cam()},{passive:false});
addEventListener('resize',cam);
/* ---- شروع ---- */
(async()=>{const r=await api('state');if(r.error){toast(r.error);return}S=r.state;off=S.now-Date.now()/1000;render(true);sc=.75;tx=innerWidth/2-400*sc;ty=(innerHeight-120)/2-600*sc;cam();setInterval(()=>render(false),500)})();
</script></body></html>
